# gitleaks config for WS3: the default rules, plus a narrow, reviewed allowlist. Every entry needs a reason.
# Merging into a repo that already has a .gitleaks.toml: add these allowlists to it.
[extend]
useDefault = true

[[allowlists]]
description = "Azure built-in role definition IDs are public GUIDs, not credentials"
regexes = [
  '''4633458b-17de-408a-b874-0445c86b69e6''',   # Key Vault Secrets User
  '''21090545-7ca7-4776-b22c-e363652d74d2''',   # Key Vault Reader (the Planner's secret metadata)
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',   # Key Vault Secrets Officer (WS1/WS2 build guides under doc/)
]

[[allowlists]]
description = "Redaction tests deliberately contain fake secrets to prove they are caught"
paths = [
  '''src/mcp-server/tests/test_backends\.py''',
  '''(^|/)__pycache__/''',
]
