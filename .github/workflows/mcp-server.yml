# WS3 MCP server: test and scan every change, then on main push <registry>/mcp-server:sha-<commit> to the private
# ACR through OIDC and roll the existing ca-mcp Container App onto it. No registry password, no client secret.
#
# Repo variables (Settings > Secrets and variables > Actions > Variables), none of them secret:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   the CI identity (id-lf-ci: AcrPush on the registry)
#   ACR_NAME, ACR_SERVER                                      e.g. acrlfxxxx and acrlfxxxx.azurecr.io
#   MCP_RESOURCE_GROUP                                        the control resource group that holds ca-mcp; unset: no deploy
#   MCP_APP_NAME                                              optional, default ca-mcp
#   AZURE_DEPLOY_CLIENT_ID                                    optional: a separate identity for the deploy job
# GitHub environments: acr-push (push job) and mcp-deploy (deploy job). Each needs a federated credential on the
# Azure identity with subject repo:<owner>/<repo>:environment:<name>.
name: mcp-server

on:
  push:
    branches: [main]
    paths: ['src/mcp-server/**', '.github/workflows/mcp-server.yml', '.gitleaks.toml']
  pull_request:
    paths: ['src/mcp-server/**', '.github/workflows/mcp-server.yml', '.gitleaks.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test-build-push:            # the required status check in scripts/setup-github.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # gitleaks scans the history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/mcp-server/requirements.txt

      - name: Tests
        working-directory: src/mcp-server
        run: |
          pip install -r requirements.txt pytest==9.2.0
          pytest -q

      - name: Install scanners (own venv, so they can't change the app's dependencies)
        run: |
          python -m venv "$RUNNER_TEMP/scan"
          "$RUNNER_TEMP/scan/bin/pip" install -q bandit==1.9.4 semgrep==1.184.0 pip-audit==2.10.1
          echo "$RUNNER_TEMP/scan/bin" >> "$GITHUB_PATH"

      - name: Bandit
        run: bandit -q -r src/mcp-server/app

      - name: Semgrep
        run: semgrep scan --config p/python --config p/security-audit --metrics off --error --quiet src/mcp-server/app scripts

      - name: pip-audit
        run: pip-audit -r src/mcp-server/requirements.txt

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 \
            git /repo -c /repo/.gitleaks.toml --redact --no-banner

      - name: Build image
        run: docker build -t "mcp-server:$IMAGE_TAG" src/mcp-server

      - name: Trivy (HIGH and CRITICAL with a fix fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "mcp-server:$IMAGE_TAG"

      - name: Keep the scanned image for the push job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save "mcp-server:$IMAGE_TAG" | gzip > "$RUNNER_TEMP/image.tar.gz"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: mcp-server-image
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1

  push:
    needs: test-build-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: acr-push
    permissions:
      contents: read
      id-token: write         # OIDC token for azure/login
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-server-image
          path: ${{ runner.temp }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push the scanned image (immutable sha tag, no latest)
        id: push
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_SERVER: ${{ vars.ACR_SERVER }}
        run: |
          gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
          az acr login --name "$ACR_NAME"
          image="$ACR_SERVER/mcp-server:$IMAGE_TAG"
          docker tag "mcp-server:$IMAGE_TAG" "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$image\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: push
    if: vars.MCP_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: mcp-deploy
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars.MCP_RESOURCE_GROUP }}
      APP: ${{ vars.MCP_APP_NAME || 'ca-mcp' }}
      IMAGE: ${{ needs.push.outputs.image }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ca-mcp, its identity, Key Vault references and roles are created once by infra/modules/mcp.bicep.
      # This job only moves the existing app to the new image; settings and secrets stay as Bicep set them.
      - name: Roll ca-mcp onto the new image
        run: |
          az extension add --name containerapp --upgrade -y --only-show-errors
          az containerapp show -g "$RG" -n "$APP" --query id -o tsv >/dev/null || {
            echo "::error::$APP not found in $RG. Deploy infra/modules/mcp.bicep once first (README, Deploy to Azure)."
            exit 1; }
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" -o none

      - name: Wait for the new revision to be healthy
        run: |
          rev=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
          fqdn=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          healthy=""
          for _ in $(seq 1 30); do
            state=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$rev" \
              --query "properties.[healthState, runningState]" -o tsv | tr '\t' ' ')
            echo "revision $rev: $state"
            case "$state" in
              Healthy\ Running*) healthy=1; break ;;
              Unhealthy*|*Failed*|*Degraded*) echo "::error::$rev is $state"; exit 1 ;;
            esac
            sleep 10
          done
          [ -n "$healthy" ] || { echo "::error::$rev not healthy after 5 minutes"; exit 1; }
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "https://$fqdn/health"
          echo "Deployed \`$IMAGE\` to $APP (revision $rev): https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
